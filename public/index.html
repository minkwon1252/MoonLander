<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tech Race — International Cooperation &amp; Competition</title>
<link rel="stylesheet" href="css/game.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="topbar-brand">
      <span class="brand-title">TECH RACE</span>
      <span class="brand-sub">International Cooperation &amp; Competition</span>
    </div>
    <div class="topbar-mid">
      <div class="topbar-stat">
        <span class="tb-label">Round</span>
        <span class="tb-value" id="roundNum">—</span>
        <span class="tb-of">/ <span id="maxRoundNum">6</span></span>
      </div>
      <div class="topbar-stat">
        <span class="tb-label">Phase</span>
        <span class="tb-value tb-phase" id="phaseLabel">Setup</span>
      </div>
      <div class="topbar-stat timer-stat hidden" id="timerStat">
        <span class="tb-label">Discussion</span>
        <span class="tb-value" id="timerDisplay">10:00</span>
        <button class="tb-btn timer-btn" id="timerToggle" title="Pause / resume timer">⏸</button>
      </div>
      <div class="topbar-stat trust-stat">
        <span class="tb-label">Global Trust</span>
        <div class="trust-meter"><div class="trust-fill" id="trustFill" style="width:60%"></div></div>
        <span class="tb-value" id="trustNum">60</span>
      </div>
    </div>
    <div class="topbar-actions">
      <a class="tb-btn" href="gamebook.html" target="_blank" rel="noopener">📒 Game Book</a>
      <button class="tb-btn" id="facilitatorToggle">☰ Facilitator</button>
    </div>
  </header>

  <div id="situationBanner" class="situation-banner hidden"></div>
  <div id="timeUpBanner" class="timeup-banner hidden"></div>

  <main id="teamGrid" class="team-grid"></main>

  <footer id="controlBar" class="control-bar"></footer>

  <div id="guideOverlay" class="overlay"></div>
  <div id="setupOverlay" class="overlay hidden"></div>
  <div id="crisisOverlay" class="overlay hidden"></div>
  <div id="summaryOverlay" class="overlay hidden"></div>
  <div id="debriefOverlay" class="overlay hidden"></div>

  <aside id="facilitatorPanel" class="facilitator-panel hidden"></aside>
  <div id="tourLayer"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/data/teams.js"></script>
<script src="js/data/domains.js"></script>
<script src="js/data/cards.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/resources.js"></script>
<script src="js/engine.js"></script>
<script src="js/roadmap.js"></script>
<script src="js/timer.js"></script>
<script src="js/export.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
